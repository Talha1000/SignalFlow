name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: signalflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:password@localhost:5432/signalflow?schema=public"
      DIRECT_URL: "postgresql://postgres:password@localhost:5432/signalflow?schema=public"
      JWT_SECRET: "ci_testing_secret_key_32_characters_minimum_length_required"
      DEMO_MODE: "false"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Sync Prisma schema to CI database
        run: npx prisma db push

      - name: Seed database
        run: npx tsx prisma/seed.ts

      - name: Run Enterprise Verification Test Suite
        run: npx tsx scripts/verify-enterprise.ts

      - name: Build Next.js Application
        run: npm run build
